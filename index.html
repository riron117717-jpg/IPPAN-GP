<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPPAN-GP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background-color: #f0f2f5;
    }
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .text-shadow {
      text-shadow: 2px 2px 0px #000;
    }
  </style>
</head>

<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center pb-20">

  <!-- ヘッダー -->
  <header class="w-full max-w-2xl mx-auto pt-10 pb-6 px-4 text-center relative">
    <h1 class="text-5xl md:text-6xl font-black text-yellow-400 text-shadow mb-2 tracking-wider">IPPAN-GP</h1>
    <p class="text-gray-500 font-semibold mb-6">みんなで選ぶ、最高の一答</p>

    <!-- 管理者ボタン -->
    <button onclick="app.showAdminLogin()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 p-2 rounded-full transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
  </header>

  <!-- メインコンテンツ -->
  <main id="appContainer" class="w-full max-w-2xl px-4"></main>

  <!-- トースト -->
  <div id="toast"
    class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
  </div>

  <!-- モーダル（alert / prompt） -->
  <div id="dialogModal"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
    <div id="dialogContent"
      class="bg-white rounded-2xl p-6 w-[90%] max-w-sm shadow-2xl transform scale-95 transition-transform duration-200">
      <h3 id="dialogMessage" class="text-lg font-bold text-gray-800 mb-4 text-center"></h3>
      <input type="text" id="dialogInput"
        class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 mb-4 hidden focus:outline-none focus:border-yellow-400" />
      <div class="flex justify-center gap-3">
        <button id="dialogCancel"
          class="px-5 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition hidden">キャンセル</button>
        <button id="dialogConfirm"
          class="px-5 py-2 bg-yellow-400 text-gray-900 font-bold rounded-lg hover:bg-yellow-500 transition w-full shadow-sm">OK</button>
      </div>
    </div>
  </div>

  <!-- 管理者パネル -->
  <div id="adminModal"
    class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-40 hidden overflow-y-auto pt-10 pb-10">
    <div class="bg-white rounded-2xl p-6 w-[95%] max-w-md shadow-2xl relative my-auto">

      <button onclick="app.hideAdmin()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center gap-2">
        <svg class="w-6 h-6 text-gray-700" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"
            clip-rule="evenodd" />
        </svg>
        管理者コントロール
      </h2>

      <div class="space-y-5">

        <div>
          <label class="block text-sm font-bold text-gray-600 mb-1">対象の回（ラウンド）</label>
          <select id="adminRound"
            class="w-full bg-gray-50 border-2 border-gray-200 text-gray-800 rounded-lg p-3 font-semibold focus:border-yellow-400 focus:outline-none"></select>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
          <label class="block text-sm font-bold text-gray-600 mb-2">操作モード</label>

          <div class="flex gap-4 mb-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="adminMode" value="new" checked onchange="app.toggleAdminMode()"
                class="text-yellow-500 focus:ring-yellow-500 w-4 h-4">
              <span class="font-semibold text-gray-700">新規追加</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="adminMode" value="update" onchange="app.toggleAdminMode()"
                class="text-yellow-500 focus:ring-yellow-500 w-4 h-4">
              <span class="font-semibold text-gray-700">既存の更新</span>
            </label>
          </div>

          <div id="newPersonArea">
            <label class="block text-xs font-bold text-gray-500 mb-1">名前</label>
            <input type="text" id="adminNewName" placeholder="名前を入力"
              class="w-full border-2 border-gray-200 rounded-lg p-3 font-semibold focus:border-yellow-400 focus:outline-none">
          </div>

          <div id="updatePersonArea" class="hidden">
            <label class="block text-xs font-bold text-gray-500 mb-1">既存のメンバー</label>
            <select id="adminNameSelect"
              class="w-full border-2 border-gray-200 rounded-lg p-3 font-semibold focus:border-yellow-400 focus:outline-none"></select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-600 mb-1">回答</label>
          <textarea id="adminAnswer" rows="3" placeholder="回答を入力してください"
            class="w-full bg-gray-50 border-2 border-gray-200 rounded-lg p-3 font-bold text-lg focus:border-yellow-400 focus:outline-none resize-none"></textarea>
        </div>

        <div class="pt-2">
          <button onclick="app.adminSubmit()"
            class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg shadow hover:bg-gray-900 transition">保存する</button>
        </div>

        <hr class="my-4 border-gray-200">

        <div class="flex flex-col gap-2">
          <button onclick="app.adminDelete()"
            class="w-full bg-red-50 text-red-600 border border-red-200 font-bold py-2 rounded-lg hover:bg-red-100 transition">選択したメンバーを削除</button>

          <button onclick="app.adminAddRound()"
            class="w-full bg-blue-50 text-blue-600 border border-blue-200 font-bold py-2 rounded-lg hover:bg-blue-100 transition">お題（回）を追加する</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase & App -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBbtqNnXTnTUywEh_ygQbR-Sbf6C0vXxxY",
      authDomain: "ippan-gp.firebaseapp.com",
      projectId: "ippan-gp",
      storageBucket: "ippan-gp.firebasestorage.app",
      messagingSenderId: "194881427223",
      appId: "1:194881427223:web:0989f067db479fe0994952",
      measurementId: "G-3LWRC1MHCG"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    /* ------------------------------
       状態管理
    ------------------------------ */
    const state = {
      people: [],      // Firestoreのデータ
      maxRound: 20,    // 最大ラウンド
      currentView: "rounds",
      currentRound: null,
      currentPersonId: null,
      isReady: false
    };

    /* ------------------------------
       UI ヘルパー
    ------------------------------ */
    const UI = {
      toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.remove("opacity-0");
        setTimeout(() => el.classList.add("opacity-0"), 2500);
      },

      modal(msg, config = {}) {
        return new Promise(resolve => {
          const modal = document.getElementById("dialogModal");
          const content = document.getElementById("dialogContent");
          const msgEl = document.getElementById("dialogMessage");
          const inputEl = document.getElementById("dialogInput");
          const cancelBtn = document.getElementById("dialogCancel");
          const confirmBtn = document.getElementById("dialogConfirm");

          msgEl.textContent = msg;

          inputEl.value = "";
          inputEl.classList.add("hidden");
          cancelBtn.classList.add("hidden");

          if (config.type === "prompt" || config.type === "password") {
            inputEl.type = config.type === "password" ? "password" : "text";
            inputEl.classList.remove("hidden");
            inputEl.placeholder = config.placeholder || "";
            inputEl.focus();
          }

          if (config.showCancel) {
            cancelBtn.classList.remove("hidden");
          }

          const cleanup = () => {
            modal.classList.add("opacity-0");
            setTimeout(() => {
              modal.classList.add("hidden");
              cancelBtn.onclick = null;
              confirmBtn.onclick = null;
            }, 200);
          };

          cancelBtn.onclick = () => { cleanup(); resolve(null); };
          confirmBtn.onclick = () => {
            let val = true;
            if (config.type === 'prompt' || config.type === 'password') {
              val = inputEl.value;
            }
            cleanup();
            resolve(val);
          };

          modal.classList.remove("hidden");
          setTimeout(() => {
            modal.classList.remove("opacity-0");
            content.classList.remove("scale-95");
          }, 10);
        });
      },

      alert(msg) { return UI.modal(msg); },
      confirm(msg) { return UI.modal(msg, { showCancel: true }); },
      prompt(msg, placeholder) { return UI.modal(msg, { type: 'prompt', showCancel: true, placeholder }); },
      password(msg) { return UI.modal(msg, { type: 'password', showCancel: true }); }
    };

    /* ------------------------------
       アプリ本体
    ------------------------------ */
    const app = {

      init() {
        const peopleRef = collection(db, "people");
        onSnapshot(peopleRef, (snapshot) => {
          state.people = [];
          let foundMax = 20;

          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            state.people.push({ id: docSnap.id, ...data });
            if (data.round > foundMax) foundMax = data.round;
          });

          state.maxRound = Math.max(state.maxRound, foundMax);
          state.isReady = true;
          app.render();
        });
      },

      navigate(view, param = null) {
        state.currentView = view;
        if (view === "roundDetail") state.currentRound = param;
        if (view === "personDetail") state.currentPersonId = param;
        app.render();
      },

      render() {
        if (!state.isReady) return;
        const container = document.getElementById("appContainer");

        if (state.currentView === "rounds") {
          container.innerHTML = app.templates.rounds();
        } else if (state.currentView === "roundDetail") {
          container.innerHTML = app.templates.roundDetail(state.currentRound);
        } else if (state.currentView === "personDetail") {
          const person = state.people.find(p => p.id === state.currentPersonId);
          container.innerHTML = app.templates.personDetail(person);
        }
      },

      /* ---- 管理者 ---- */
      showAdminLogin() {
        UI.password("管理者パスワードを入力").then(pw => {
          if (pw === "1919") app.showAdmin();
          else UI.toast("パスワードが違います");
        });
      },

      showAdmin() {
        document.getElementById("adminModal").classList.remove("hidden");
        app.renderAdmin();
      },

      hideAdmin() {
        document.getElementById("adminModal").classList.add("hidden");
      },

      toggleAdminMode() {
        const mode = document.querySelector("input[name='adminMode']:checked").value;
        document.getElementById("newPersonArea").classList.toggle("
