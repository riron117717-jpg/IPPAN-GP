<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPAN-GP</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 40px 0;
}
h1 {
  font-size: 60px;
  margin-bottom: 10px;
}
button {
  display: block;
  width: 85%;
  max-width: 350px;
  margin: 20px auto;
  padding: 22px;
  font-size: 28px;
  border-radius: 12px;
  border: none;
  background: #333;
  color: white;
}
.name {
  font-weight: normal;
  font-size: 24px;
  text-align: left;
  margin-left: 25px;
}
.answer {
  margin-top: 35px;
  font-size: 42px;
  font-weight: bold;
}
img {
  width: 100%;
  max-width: 650px;
  border-radius: 10px;
  margin-top: 40px;
}
#adminPanel {
  display: none;
  margin-top: 20px;
}
.admin-box {
  background: #444;
  color: white;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 450px;
  margin: 0 auto;
}
input, select, textarea {
  width: 90%;
  font-size: 20px;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
.count {
  font-size: 26px;
  font-weight: bold;
  color: #ff5252;
  margin-left: 10px;
}
</style>
</head>

<body>

<h1 id="title">IPPAN-GP</h1>

<!-- 管理者画面 -->
<div id="adminPanel">
  <div class="admin-box">
    <h2>管理者専用</h2>

    <label>第何回</label>
    <select id="adminRound"></select>

    <label>名前（既存＋新規追加）</label>
    <select id="adminNameSelect"></select>
    <input type="text" id="adminNewName" placeholder="新しい名前を追加">

    <label>回答</label>
    <textarea id="adminAnswer" placeholder="回答を入力"></textarea>

    <button onclick="adminAdd()">追加 / 更新</button>
    <button onclick="hideAdmin()">閉じる</button>
    <button onclick="clearAdminInputs()">入力クリア</button>
    <button onclick="deletePerson()">選択した投稿を削除</button>
    <button onclick="addRound()">お題を追加</button>
  </div>
</div>

<div id="menu">
  <button onclick="showRounds()">スタート</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBbtqNnXTnTUywEh_ygQbR-Sbf6C0vXxxY",
    authDomain: "ippan-gp.firebaseapp.com",
    projectId: "ippan-gp",
    storageBucket: "ippan-gp.firebasestorage.app",
    messagingSenderId: "194881427223",
    appId: "1:194881427223:web:0989f067db479fe0994952",
    measurementId: "G-3LWRC1MHCG"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let people = {};
  let currentRound = null;
  let maxRound = 20;

  // Firestoreから読み込み
  async function loadPeople() {
    const querySnapshot = await getDocs(collection(db, "people"));
    people = {};
    maxRound = 20;

    querySnapshot.forEach((docSnap) => {
      const d = docSnap.data();
      people[d.name] = { answer: d.answer, count: d.count || 0, round: d.round };
      if (d.round > maxRound) maxRound = d.round;
    });

    showRounds();
  }

  // ★ 修正版 adminAdd()
  async function adminAdd() {
    const round = Number(document.getElementById("adminRound").value);
    const selectedName = document.getElementById("adminNameSelect").value || "";
    const newName = document.getElementById("adminNewName").value.trim();
    const answer = document.getElementById("adminAnswer").value.trim();

    const finalName = newName !== "" ? newName : selectedName;

    if (!round || !finalName || !answer) {
      alert("全部入力してね");
      return;
    }

    const querySnapshot = await getDocs(collection(db, "people"));
    let foundId = null;

    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      if (data.name === finalName) {
        foundId = docSnap.id;
      }
    });

    if (foundId) {
      await updateDoc(doc(db, "people", foundId), {
        answer: answer,
        round: round
      });
      alert(`「${finalName}」の回答を更新しました！`);
    } else {
      await addDoc(collection(db, "people"), {
        name: finalName,
        answer: answer,
        count: 0,
        round: round
      });
      alert(`第${round}回に「${finalName}」を追加しました！`);
    }

    clearAdminInputs();
    loadPeople();
  }

  // 入力クリア
  function clearAdminInputs() {
    document.getElementById("adminNewName").value = "";
    document.getElementById("adminAnswer").value = "";
  }

  // 投稿削除
  async function deletePerson() {
    const selectedName = document.getElementById("adminNameSelect").value;
    if (!selectedName) {
      alert("削除する名前を選んでね");
      return;
    }

    const ok = confirm(`「${selectedName}」を本当に削除しますか？`);
    if (!ok) return;

    const querySnapshot = await getDocs(collection(db, "people"));
    let deleted = false;

    querySnapshot.forEach(async (docSnap) => {
      if (docSnap.data().name === selectedName) {
        await deleteDoc(doc(db, "people", docSnap.id));
        deleted = true;
      }
    });

    alert(`「${selectedName}」を削除しました`);
    loadPeople();
  }

  // お題追加
  function addRound() {
    const newRound = Number(prompt("追加する回数を入力（例：21）"));
    if (!newRound || newRound <= maxRound) {
      alert("正しい数字を入力してね");
      return;
    }
    maxRound = newRound;
    alert(`第${newRound}回を追加しました`);
    showRounds();
  }

  // 投票
  async function vote(name) {
    const querySnapshot = await getDocs(collection(db, "people"));
    querySnapshot.forEach(async (docSnap) => {
      if (docSnap.data().name === name) {
        const newCount = (docSnap.data().count || 0) + 1;
        await updateDoc(doc(db, "people", docSnap.id), { count: newCount });
      }
    });
    loadPeople();
  }

  function adminLogin() {
    let pw = prompt("パスワードを入力してください");
    if (pw === "1919") {
      showAdmin();
    } else {
      alert("パスワードが違います");
    }
  }

  function showAdmin() {
    let roundSel = document.getElementById("adminRound");
    roundSel.innerHTML = "";
    for (let i = 1; i <= maxRound; i++) {
      roundSel.innerHTML += `<option value="${i}">第${i}回</option>`;
    }

    let nameSel = document.getElementById("adminNameSelect");
    nameSel.innerHTML = "";
    for (let name in people) {
      nameSel.innerHTML += `<option value="${name}">${name}</option>`;
    }

    document.getElementById("adminPanel").style.display = "block";
  }

  function hideAdmin() {
    document.getElementById("adminPanel").style.display = "none";
  }

  // ★ 第2回だけ画像表示
  function showRound(n) {
    currentRound = n;
    document.getElementById("title").innerText = `第${n}回`;

    let html = `<div class="name">第${n}回</div><br>`;

    if (n === 2) {
      html += `<img src="IMG_8067.jpeg"><br>`;
    }

    for (let name in people) {
      if (people[name].round == n) {
        html += `<button onclick="showPerson('${name}')">${name} <span class="count">(${people[name].count})</span></button>`;
      }
    }

    html += `<button onclick="showRounds()">戻る</button>`;
    document.getElementById("menu").innerHTML = html;
  }

  function showPerson(name) {
    let data = people[name];

    document.getElementById("title").innerText = "IPPAN-GP";
    document.getElementById("menu").innerHTML = `
      <div class="name">${name} <span class="count">(${data.count})</span></div>
      <br>
      <img src="IMG_8067.jpeg">
      <div class="answer">${data.answer}</div>

      <button onclick="vote('${name}')">投票する</button>
      <button onclick="showRound(${currentRound})">戻る</button>
    `;
  }

  window.onload = loadPeople;

  // グローバル化
  window.showRounds = showRounds;
  window.showRound = showRound;
  window.showPerson = showPerson;
  window.adminLogin = adminLogin;
  window.adminAdd = adminAdd;
  window.vote = vote;
  window.clearAdminInputs = clearAdminInputs;
  window.deletePerson = deletePerson;
  window.addRound = addRound;

</script>

</body>
</html>
