<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPAN-GP</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 40px 0; /* 上下に余白を追加して見切れ防止 */
}
h1 {
  font-size: 60px;
  margin-bottom: 20px;
}
button {
  display: block;
  width: 85%;
  max-width: 350px;
  margin: 20px auto;
  padding: 22px;
  font-size: 28px;
  border-radius: 12px;
  border: none;
  background: #333;
  color: white;
}
.name {
  font-weight: normal;
  font-size: 24px;
  text-align: left;
  margin-left: 25px;
}
.answer {
  margin-top: 35px;
  font-size: 42px;
  font-weight: bold;
}
img {
  width: 100%;
  max-width: 650px;
  border-radius: 10px;
  margin-top: 40px;
}
.admin {
  margin-top: 60px;
  background: #444;
  color: white;
  padding: 15px;
  border-radius: 10px;
  width: 90%;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
input, textarea {
  width: 90%;
  font-size: 20px;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1 id="title">IPPAN-GP</h1>

<div id="menu">
  <button onclick="showRounds()">スタート</button>
</div>

<div id="adminPanel" style="display:none;">
  <div class="admin">
    <h2>管理者専用：回答追加</h2>
    <input type="text" id="newName" placeholder="名前を入力">
    <textarea id="newAnswer" placeholder="回答を入力"></textarea>
    <button onclick="addPerson()">追加</button>
    <button onclick="hideAdmin()">閉じる</button>
  </div>
</div>

<script>
let currentRound = null;
let people = {
  "カースト最下層さん": "へ〜まだあるんだ",
  "受水槽室さん": "すいません隣の席も埋まってるんですよ〜。",
  "お紅茶さん": "突然すみません、王様ゲームやりませんか",
  "ジズエ4545さん": "太「リス」ぎ",
  "一郎2留手帳持ちさん": "グリフィンドールだったピーター・ペティグリュー",
  "アハンアン・虹寝るしーさん": "いや、モルモットじゃなくて森本です。",
  "玉野筋男さん": "実は青いところが本体です。"
};

function showRounds() {
  currentRound = null;
  document.getElementById("title").innerText = "IPPAN-GP";
  let html = "";
  for (let i = 1; i <= 20; i++) {
    html += `<button onclick="showRound(${i})">第${i}回</button>`;
  }
  html += `<button style="background:#555;" onclick="showAdmin()">管理者専用</button>`;
  document.getElementById("menu").innerHTML = html;
}

function showRound(n) {
  currentRound = n;
  document.getElementById("title").innerText = `第${n}回`;

  if (n === 2) {
    let html = `<div class="name">第${n}回</div><br><img src="IMG_8067.jpeg">`;
    for (let name in people) {
      html += `<button onclick="showPerson('${name}')">${name}</button>`;
    }
    html += `<button onclick="showRounds()">戻る</button>`;
    document.getElementById("menu").innerHTML = html;
  } else {
    document.getElementById("menu").innerHTML = `
      <div style="font-size:28px;">第${n}回のデータはまだありません。</div>
      <button onclick="showRounds()">戻る</button>
    `;
  }
}

function showPerson(name) {
  document.getElementById("title").innerText = "IPPAN-GP";
  let answer = people[name] || "回答が未登録です。";
  document.getElementById("menu").innerHTML = `
    <div class="name">${name}</div>
    <br>
    <img src="IMG_8067.jpeg">
    <div class="answer">${answer}</div>
    <button onclick="showRound(${currentRound})">戻る</button>
  `;
}

function showAdmin() {
  document.getElementById("adminPanel").style.display = "block";
}

function hideAdmin() {
  document.getElementById("adminPanel").style.display = "none";
}

function addPerson() {
  const name = document.getElementById("newName").value.trim();
  const answer = document.getElementById("newAnswer").value.trim();
  if (name && answer) {
    people[name] = answer;
    alert(`「${name}」を追加しました！`);
    document.getElementById("newName").value = "";
    document.getElementById("newAnswer").value = "";
  } else {
    alert("名前と回答を入力してください。");
  }
}
</script>

</body>
</html>
