<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPAN-GP</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 40px 0;
}
h1 {
  font-size: 60px;
  margin-bottom: 10px;
}
button {
  display: block;
  width: 85%;
  max-width: 350px;
  margin: 20px auto;
  padding: 22px;
  font-size: 28px;
  border-radius: 12px;
  border: none;
  background: #333;
  color: white;
}
.name {
  font-weight: normal;
  font-size: 24px;
  text-align: left;
  margin-left: 25px;
}
.answer {
  margin-top: 35px;
  font-size: 42px;
  font-weight: bold;
}
img {
  width: 100%;
  max-width: 650px;
  border-radius: 10px;
  margin-top: 40px;
}

/* IPPANボタン */
.ippan-btn {
  background: #222;
  color: white;
  font-size: 22px;
  font-weight: bold;
  border-radius: 50%;
  width: 80px;
  height: 80px;
  line-height: 80px;
  margin: 25px auto 10px;
  cursor: pointer;
  transition: transform 0.3s ease, background 0.3s ease;
}
.ippan-btn.clicked {
  background: #ff5252;
  transform: scale(1.3);
  animation: pulse 0.6s ease;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,82,82,0.7); }
  70% { box-shadow: 0 0 0 20px rgba(255,82,82,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,82,82,0); }
}

/* 取り消しボタン */
.cancel-btn {
  background: #666;
  color: white;
  font-size: 20px;
  padding: 12px;
  width: 150px;
  margin: 10px auto;
  border-radius: 10px;
}

/* 管理者画面 */
#adminPanel {
  display: none;
  margin-top: 20px;
}
.admin-box {
  background: #444;
  color: white;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 450px;
  margin: 0 auto;
}
input, select, textarea {
  width: 90%;
  font-size: 20px;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
.count {
  font-size: 26px;
  font-weight: bold;
  color: #ff5252;
  margin-left: 10px;
}
</style>
</head>

<body>

<h1 id="title">IPPAN-GP</h1>

<!-- 管理者画面（タイトルの下に隠す） -->
<div id="adminPanel">
  <div class="admin-box">
    <h2>管理者専用</h2>

    <label>第何回</label>
    <input type="number" id="adminRound" placeholder="例：2">

    <label>名前（既存＋新規追加）</label>
    <select id="adminNameSelect"></select>
    <input type="text" id="adminNewName" placeholder="新しい名前を追加">

    <label>回答</label>
    <textarea id="adminAnswer" placeholder="回答を入力"></textarea>

    <button onclick="adminAdd()">追加 / 更新</button>
    <button onclick="hideAdmin()">閉じる</button>
  </div>
</div>

<div id="menu">
  <button onclick="showRounds()">スタート</button>
</div>

<script>
let currentRound = null;

// ★ 票データ
let people = {
  "カースト最下層さん": { answer: "へ〜まだあるんだ", count: 0 },
  "受水槽室さん": { answer: "すいません隣の席も埋まってるんですよ〜。", count: 0 },
  "お紅茶さん": { answer: "突然すみません、王様ゲームやりませんか", count: 0 },
  "ジズエ4545さん": { answer: "太「リス」ぎ", count: 0 },
  "一郎2留手帳持ちさん": { answer: "グリフィンドールだったピーター・ペティグリュー", count: 0 },
  "アハンアン・虹寝るしーさん": { answer: "いや、モルモットじゃなくて森本です。", count: 0 },
  "玉野筋男さん": { answer: "実は青いところが本体です。", count: 0 }
};

// ★ 押したかどうか（取り消し対応）
let voted = {};

function showRounds() {
  currentRound = null;
  document.getElementById("title").innerText = "IPPAN-GP";

  let html = "";
  for (let i = 1; i <= 20; i++) {
    html += `<button onclick="showRound(${i})">第${i}回</button>`;
  }
  html += `<button style="background:#555;" onclick="adminLogin()">管理者専用</button>`;
  document.getElementById("menu").innerHTML = html;
}

function adminLogin() {
  let pw = prompt("パスワードを入力してください");
  if (pw === "1919") {
    showAdmin();
  } else {
    alert("パスワードが違います");
  }
}

function showAdmin() {
  // 既存の名前をセレクトに入れる
  let sel = document.getElementById("adminNameSelect");
  sel.innerHTML = "";
  for (let name in people) {
    sel.innerHTML += `<option value="${name}">${name}</option>`;
  }

  document.getElementById("adminPanel").style.display = "block";
}

function hideAdmin() {
  document.getElementById("adminPanel").style.display = "none";
}

function adminAdd() {
  const round = document.getElementById("adminRound").value;
  const selectedName = document.getElementById("adminNameSelect").value;
  const newName = document.getElementById("adminNewName").value.trim();
  const answer = document.getElementById("adminAnswer").value.trim();

  let finalName = newName || selectedName;

  if (!round || !finalName || !answer) {
    alert("全部入力してね");
    return;
  }

  people[finalName] = { answer: answer, count: people[finalName]?.count || 0 };

  alert(`第${round}回に「${finalName}」を登録しました！`);
}

function showRound(n) {
  currentRound = n;
  document.getElementById("title").innerText = `第${n}回`;

  if (n === 2) {
    let html = `<div class="name">第${n}回</div><br><img src="IMG_8067.jpeg">`;
    for (let name in people) {
      html += `<button onclick="showPerson('${name}')">${name} <span class="count">(${people[name].count})</span></button>`;
    }
    html += `<button onclick="showRounds()">戻る</button>`;
    document.getElementById("menu").innerHTML = html;
  } else {
    document.getElementById("menu").innerHTML = `
      <div style="font-size:28px;">第${n}回のデータはまだありません。</div>
      <button onclick="showRounds()">戻る</button>
    `;
  }
}

function showPerson(name) {
  document.getElementById("title").innerText = "IPPAN-GP";
  let data = people[name];

  document.getElementById("menu").innerHTML = `
    <div class="name">${name} <span class="count">(${data.count})</span></div>
    <br>
    <img src="IMG_8067.jpeg">
    <div class="answer">${data.answer}</div>

    <div class="ippan-btn" onclick="vote('${name}', this)">IPPAN</div>
    <div class="cancel-btn" onclick="cancelVote('${name}')">取り消し</div>

    <button onclick="showRound(${currentRound})">戻る</button>
  `;
}

function vote(name, btn) {
  if (voted[name]) {
    alert("すでに押してます。取り消しボタンを使ってね");
    return;
  }

  voted[name] = true;
  people[name].count++;

  btn.classList.add("clicked");
  btn.innerText = "★";

  setTimeout(() => {
    btn.innerText = "IPPAN";
    btn.classList.remove("clicked");
  }, 800);

  showPerson(name);
}

function cancelVote(name) {
  if (!voted[name]) {
    alert("まだ押してないよ");
    return;
  }

  voted[name] = false;
  people[name].count--;

  showPerson(name);
}
</script>

</body>
</html>
