  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // ã¦ã¼ã¶ã¼æå®ã®Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBbtqNnXTnTUywEh_ygQbR-Sbf6C0vXxxY",
      authDomain: "ippan-gp.firebaseapp.com",
      projectId: "ippan-gp",
      storageBucket: "ippan-gp.firebasestorage.app",
      messagingSenderId: "194881427223",
      appId: "1:194881427223:web:0989f067db479fe0994952",
      measurementId: "G-3LWRC1MHCG"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    // ã¢ããªã±ã¼ã·ã§ã³ã®ç¶æ
    const state = {
      people: [],     // åç­èã®ãã¼ã¿ { id, name, answer, count, round }
      roundsData: [], // ãé¡ã¨ç»åã®ãã¼ã¿ { id, round, title, imageUrl }
      maxRound: 20,   // ããã©ã«ãã®æå¤§ã©ã¦ã³ã
      currentView: 'rounds', // ç»é¢ç¶æ: 'rounds', 'roundDetail', 'personDetail'
      currentRound: null,
      currentPersonId: null,
      isReady: false
    };

    // ã«ã¹ã¿ã UIãã«ãã¼ï¼alert, confirm, promptã®ä»£æ¿ï¼
    const UI = {
      toast: (msg) => {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('opacity-0');
        setTimeout(() => el.classList.add('opacity-0'), 3000);
      },
      _showModal: (msg, config = {}) => {
        return new Promise((resolve) => {
          const modal = document.getElementById('dialogModal');
          const content = document.getElementById('dialogContent');
          const msgEl = document.getElementById('dialogMessage');
          const inputEl = document.getElementById('dialogInput');
          const cancelBtn = document.getElementById('dialogCancel');
          const confirmBtn = document.getElementById('dialogConfirm');

          msgEl.textContent = msg;
          inputEl.value = '';
          inputEl.classList.add('hidden');
          cancelBtn.classList.add('hidden');
          
          if (config.type === 'prompt' || config.type === 'password') {
            inputEl.type = config.type === 'password' ? 'password' : 'text';
            inputEl.classList.remove('hidden');
            inputEl.placeholder = config.placeholder || '';
            inputEl.focus();
          }
          if (config.showCancel) {
            cancelBtn.classList.remove('hidden');
          }

          const cleanup = () => {
            modal.classList.add('opacity-0');
            setTimeout(() => {
              modal.classList.add('hidden');
              cancelBtn.onclick = null;
              confirmBtn.onclick = null;
            }, 200);
          };

          cancelBtn.onclick = () => { cleanup(); resolve(null); };
          confirmBtn.onclick = () => {
            let val = true;
            if (config.type === 'prompt' || config.type === 'password') {
              val = inputEl.value;
            }
            cleanup();
            resolve(val);
          };

          modal.classList.remove('hidden');
          setTimeout(() => {
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
          }, 10);
        });
      },
      alert: (msg) => UI._showModal(msg),
      confirm: (msg) => UI._showModal(msg, { showCancel: true }),
      prompt: (msg, placeholder) => UI._showModal(msg, { type: 'prompt', showCancel: true, placeholder }),
      password: (msg) => UI._showModal(msg, { type: 'password', showCancel: true })
    };

    const app = {
      init: () => {
        // 1. peopleã³ã¬ã¯ã·ã§ã³ã®ç£è¦ (åç­ãã¼ã¿)
        const peopleRef = collection(db, "people");
        onSnapshot(peopleRef, (snapshot) => {
          state.people = [];
          let foundMax = 20;
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            state.people.push({ id: docSnap.id, ...data });
            if (data.round > foundMax) foundMax = data.round;
          });
          state.maxRound = Math.max(state.maxRound, foundMax); 
          state.isReady = true;
          app.render();
        }, (e) => console.error(e));

        // 2. roundsã³ã¬ã¯ã·ã§ã³ã®ç£è¦ (ãé¡ã»ç»åãã¼ã¿)
        const roundsRef = collection(db, "rounds");
        onSnapshot(roundsRef, (snapshot) => {
          state.roundsData = [];
          snapshot.forEach((docSnap) => {
            state.roundsData.push({ id: docSnap.id, ...docSnap.data() });
          });
          app.render(); // ãé¡æå ±ãæ´æ°ããããåæç»
        }, (e) => console.error(e));
      },

      render: () => {
        if (!state.isReady) return;
        const container = document.getElementById('appContainer');
        
        if (state.currentView === 'rounds') {
          container.innerHTML = app.templates.rounds();
        } else if (state.currentView === 'roundDetail') {
          container.innerHTML = app.templates.roundDetail(state.currentRound);
        } else if (state.currentView === 'personDetail') {
          const person = state.people.find(p => p.id === state.currentPersonId);
          if (person) {
            container.innerHTML = app.templates.personDetail(person);
          } else {
            app.navigate('rounds');
          }
        }
      },

      navigate: (view, param = null) => {
        state.currentView = view;
        if (view === 'roundDetail') state.currentRound = param;
        if (view === 'personDetail') state.currentPersonId = param;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        app.render();
      },

      templates: {
        // ãã«ãã¼ï¼å¯¾è±¡ã®åã®ç»åãã¿ã¤ãã«ãæç»ããããã®HTMLçæ
        getRoundMediaHtml: (roundNum) => {
          const rData = state.roundsData.find(r => r.round === roundNum);
          let html = '';
          if (rData) {
            if (rData.title) {
              html += `<div class="bg-gray-800 text-white p-4 md:p-6 rounded-2xl mb-6 shadow-md border-l-4 border-yellow-400">
                         <p class="text-lg md:text-xl font-bold whitespace-pre-wrap">${rData.title}</p>
                       </div>`;
            }
            if (rData.imageUrl) {
              const fallback = "https://placehold.co/600x400/eeeeee/888888?text=Image+Not+Found";
              html += `<img src="${rData.imageUrl}" onerror="this.onerror=null;this.src='${fallback}';" class="w-full rounded-2xl shadow-sm mb-6 object-cover border-2 border-white bg-gray-200" alt="ãé¡ç»å">`;
            }
          }
          return html;
        },

        rounds: () => {
          let html = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-4 fade-in">`;
          for (let i = 1; i <= state.maxRound; i++) {
            const count = state.people.filter(p => p.round === i).length;
            const rData = state.roundsData.find(r => r.round === i);
            let titleSnippet = '';
            if (rData && rData.title) {
              // ãé¡æã®ä¸é¨ããµã ãã¤ã«è¡¨ç¤º
              const shortTitle = rData.title.length > 15 ? rData.title.substring(0, 15) + '...' : rData.title;
              titleSnippet = `<div class="text-xs text-gray-500 mt-2 bg-gray-50 p-1 rounded border border-gray-100">${shortTitle}</div>`;
            }

            html += `
              <button onclick="app.navigate('roundDetail', ${i})" class="bg-white hover:bg-yellow-50 border-2 border-gray-200 hover:border-yellow-400 p-4 sm:p-6 rounded-2xl shadow-sm transition-all transform hover:-translate-y-1 group text-left">
                <div class="text-xl font-black text-gray-800 group-hover:text-yellow-600">ç¬¬${i}å</div>
                <div class="text-xs text-gray-400 mt-1 font-semibold flex items-center gap-1">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                  ${count} ä»¶ã®åç­
                </div>
                ${titleSnippet}
              </button>
            `;
          }
          html += `</div>`;
          return html;
        },

        roundDetail: (roundNum) => {
          const participants = state.people.filter(p => p.round === roundNum);
          
          let html = `
            <div class="fade-in max-w-lg mx-auto">
              <div class="flex items-center justify-between mb-6">
                <button onclick="app.navigate('rounds')" class="text-gray-600 hover:text-gray-900 font-bold flex items-center gap-1 bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-200 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                  ä¸è¦§ã¸
                </button>
                <h2 class="text-3xl font-black text-gray-800 tracking-wider">ç¬¬${roundNum}å</h2>
                <div class="w-24"></div>
              </div>
          `;

          // ãé¡æã¨ç»åã®æç»
          html += app.templates.getRoundMediaHtml(roundNum);

          if (participants.length === 0) {
            html += `<div class="text-center py-12 text-gray-400 font-bold bg-white rounded-2xl shadow-sm border border-gray-100">ã¾ã åç­ãããã¾ãã</div>`;
          } else {
            // ç²å¾ç¥¨æ°ãå¤ãé ã«ã½ã¼ããã¦è¡¨ç¤º
            participants.sort((a, b) => (b.count || 0) - (a.count || 0));
            html += `<div class="space-y-4">`;
            participants.forEach(p => {
              html += `
                <button onclick="app.navigate('personDetail', '${p.id}')" class="w-full bg-white border border-gray-200 hover:border-yellow-400 p-5 rounded-2xl shadow-sm hover:shadow-md transition-all flex justify-between items-center group text-left">
                  <span class="text-xl font-black text-gray-800 group-hover:text-yellow-600 truncate mr-4">${p.name}</span>
