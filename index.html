<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPAN-GP</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 40px 0;
}
h1 {
  font-size: 60px;
  margin-bottom: 20px;
}
button {
  display: block;
  width: 85%;
  max-width: 350px;
  margin: 20px auto;
  padding: 22px;
  font-size: 28px;
  border-radius: 12px;
  border: none;
  background: #333;
  color: white;
}
.name {
  font-weight: normal;
  font-size: 24px;
  text-align: left;
  margin-left: 25px;
}
.answer {
  margin-top: 35px;
  font-size: 42px;
  font-weight: bold;
}
img {
  width: 100%;
  max-width: 650px;
  border-radius: 10px;
  margin-top: 40px;
}
.ippan-btn {
  position: relative;
  display: inline-block;
  margin-top: 25px;
  background: #222;
  color: white;
  font-size: 22px;
  font-weight: bold;
  border-radius: 50%;
  width: 80px;
  height: 80px;
  line-height: 80px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.3s ease, background 0.3s ease;
}
.ippan-btn.clicked {
  background: #ff5252;
  transform: scale(1.3);
  animation: pulse 0.6s ease;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,82,82,0.7); }
  70% { box-shadow: 0 0 0 20px rgba(255,82,82,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,82,82,0); }
}
.count {
  font-size: 26px;
  font-weight: bold;
  color: #ff5252;
  margin-left: 10px;
}
.admin {
  margin-top: 60px;
  background: #444;
  color: white;
  padding: 15px;
  border-radius: 10px;
  width: 90%;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
input, textarea {
  width: 90%;
  font-size: 20px;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1 id="title">IPPAN-GP</h1>

<div id="menu">
  <button onclick="showRounds()">スタート</button>
</div>

<div id="adminPanel" style="display:none;">
  <div class="admin">
    <h2>管理者専用：回答追加</h2>
    <input type="text" id="newName" placeholder="名前を入力">
    <textarea id="newAnswer" placeholder="回答を入力"></textarea>
    <button onclick="addPerson()">追加</button>
    <button onclick="hideAdmin()">閉じる</button>
  </div>
</div>

<script>
let currentRound = null;

// ★ 票データ
let people = {
  "カースト最下層さん": { answer: "へ〜まだあるんだ", count: 0 },
  "受水槽室さん": { answer: "すいません隣の席も埋まってるんですよ〜。", count: 0 },
  "お紅茶さん": { answer: "突然すみません、王様ゲームやりませんか", count: 0 },
  "ジズエ4545さん": { answer: "太「リス」ぎ", count: 0 },
  "一郎2留手帳持ちさん": { answer: "グリフィンドールだったピーター・ペティグリュー", count: 0 },
  "アハンアン・虹寝るしーさん": { answer: "いや、モルモットじゃなくて森本です。", count: 0 },
  "玉野筋男さん": { answer: "実は青いところが本体です。", count: 0 }
};

// ★ 押したかどうか（取り消し対応）
let voted = {};

function showRounds() {
  currentRound = null;
  document.getElementById("title").innerText = "IPPAN-GP";
  let html = "";
  for (let i = 1; i <= 20; i++) {
    html += `<button onclick="showRound(${i})">第${i}回</button>`;
  }
  html += `<button style="background:#555;" onclick="adminLogin()">管理者専用</button>`;
  document.getElementById("menu").innerHTML = html;
}

function adminLogin() {
  let pw = prompt("パスワードを入力してください");
  if (pw === "1919") {
    showAdmin();
  } else {
    alert("パスワードが違います");
  }
}

function showAdmin() {
  document.getElementById("adminPanel").style.display = "block";
}

function hideAdmin() {
  document.getElementById("adminPanel").style.display = "none";
}

function showRound(n) {
  currentRound = n;
  document.getElementById("title").innerText = `第${n}回`;

  if (n === 2) {
    let html = `<div class="name">第${n}回</div><br><img src="IMG_8067.jpeg">`;
    for (let name in people) {
      html += `<button onclick="showPerson('${name}')">${name} <span class="count">(${people[name].count})</span></button>`;
    }
    html += `<button onclick="showRounds()">戻る</button>`;
    document.getElementById("menu").innerHTML = html;
  } else {
    document.getElementById("menu").innerHTML = `
      <div style="font-size:28px;">第${n}回のデータはまだありません。</div>
      <button onclick="showRounds()">戻る</button>
    `;
  }
}

function showPerson(name) {
  document.getElementById("title").innerText = "IPPAN-GP";
  let data = people[name];

  document.getElementById("menu").innerHTML = `
    <div class="name">${name} <span class="count">(${data.count})</span></div>
    <br>
    <img src="IMG_8067.jpeg">
    <div class="answer">${data.answer}</div>
    <div class="ippan-btn" onclick="vote('${name}', this)">IPPAN</div>
    <button onclick="showRound(${currentRound})">戻る</button>
  `;
}

function vote(name, btn) {
  // ★ 押してない → 押す（+1）
  if (!voted[name]) {
    voted[name] = true;
    people[name].count++;
    btn.classList.add("clicked");
    btn.innerText = "★";
    setTimeout(() => {
      btn.innerText = "IPPAN";
      btn.classList.remove("clicked");
    }, 800);
  } 
  // ★ 押してる → 取り消し（-1）
  else {
    voted[name] = false;
    people[name].count--;
    btn.classList.add("clicked");
    btn.innerText = "✕";
    setTimeout(() => {
      btn.innerText = "IPPAN";
      btn.classList.remove("clicked");
    }, 800);
  }

  // 表示更新
  showPerson(name);
}

function addPerson() {
  const name = document.getElementById("newName").value.trim();
  const answer = document.getElementById("newAnswer").value.trim();
  if (name && answer) {
    people[name] = { answer: answer, count: 0 };
    alert(`「${name}」を追加しました！`);
    document.getElementById("newName").value = "";
    document.getElementById("newAnswer").value = "";
  } else {
    alert("名前と回答を入力してください。");
  }
}
</script>

</body>
</html>
